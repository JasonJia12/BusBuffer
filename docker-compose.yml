# AI edited; see AI_transcript_full.md for details.
services:
  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # the producer runs on the laptop, Spark runs in containers
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  cassandra:
    image: cassandra:5.0.9
    ports:
      - "9042:9042"
    environment:
      # by default it takes half of Docker's memory
      MAX_HEAP_SIZE: 1G
    volumes:
      - cassandra-data:/var/lib/cassandra

  spark-master:
    build: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    working_dir: /project
    environment:
      PYTHONPATH: /project
    volumes:
      - .:/project

  spark-worker:
    build: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      PYTHONPATH: /project
    volumes:
      - .:/project

volumes:
  kafka-data:
  cassandra-data:
